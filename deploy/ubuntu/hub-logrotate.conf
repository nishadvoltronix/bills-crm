# Install as /etc/logrotate.d/voltronix-hub only after creating this 0700 log dir.
# These exact files belong to HUB; no other PM2 application's logs are matched.
/home/rjpmadmin/hub-deploy-logs/deploy.log
/home/rjpmadmin/hub-deploy-logs/hub-api.out.log
/home/rjpmadmin/hub-deploy-logs/hub-api.error.log
/home/rjpmadmin/hub-deploy-logs/voltronix-hub.out.log
/home/rjpmadmin/hub-deploy-logs/voltronix-hub.error.log
{
    daily
    rotate 14
    maxsize 20M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su rjpmadmin rjpmadmin
    create 0600 rjpmadmin rjpmadmin
}
